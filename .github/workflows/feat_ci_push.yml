name: Feat CI Push

on:
  push:
    branches-ignore:
      - main
      - 'release-*.*.*'
      - development
    paths:
      - 'cmd/**/*' # Trigger if any file changes in the defined directory
      - 'internal/**/*'
      - 'pkg/**/*'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/feat_ci_push.yml'

permissions: {}

jobs:
  feat-ci-push:
    uses: ghdrope/templates-ci/.github/workflows/go-feat_ci_push.yml@main
    permissions:
      contents: read
